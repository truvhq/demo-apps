[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urla"
version = "0.1.0"
description = "Shared 1003/URLA loan application data model, Truv-fillability catalog, and Truv-to-URLA mapping, used by both the POS and LOS Django projects."
requires-python = ">=3.11"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15,<3.16",
]

[tool.setuptools.packages.find]
include = ["urla*"]
